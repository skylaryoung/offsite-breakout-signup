<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breakout signup</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #161b26;
      --muted: #5d6576;
      --line: #e2e5ea;
      --field: #cfd4dc;
      --accent: #2554d6;
      --accent-hover: #1d45b5;
      --accent-soft: #e6edfc;
      --ok: #157347;
      --ok-soft: #e7f4ed;
      --danger: #b42318;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }
    h1 { font-size: 1.6rem; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-weight: 500; margin: 0; }
    .intro { margin: 12px 0 0; }

    .notice {
      margin-top: 20px; padding: 12px 14px; border-radius: 10px;
      background: var(--ok-soft); color: var(--ok); font-weight: 500;
      display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    }
    .notice.closed { background: #eef0f3; color: var(--muted); }

    .list { display: grid; gap: 14px; margin-top: 20px; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; box-shadow: var(--shadow);
    }
    .card.mine { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
    .card h2 { font-size: 1.1rem; line-height: 1.3; margin: 0; }
    .room { color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .desc { font-size: .95rem; margin: 10px 0 0; }

    .meter { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: .88rem; color: var(--muted); }
    .bar { flex: 1; height: 6px; background: #edf0f3; border-radius: 99px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
    .card.full .bar > span { background: #9aa1ad; }

    .people { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .people li { font-size: .85rem; background: #f1f3f6; border-radius: 99px; padding: 4px 10px; }
    .people li span { color: var(--muted); }
    .people li.empty { background: none; padding: 0; color: var(--muted); }

    button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid transparent; padding: 11px 16px; min-height: 44px; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; }
    .primary { background: var(--accent); color: #fff; font-weight: 600; width: 100%; }
    .primary:hover:not(:disabled) { background: var(--accent-hover); }
    .primary:disabled { background: #d5d9e0; color: #5d6576; cursor: default; }
    .primary.in:disabled { background: var(--ok-soft); color: var(--ok); }
    .secondary { background: #fff; border-color: var(--field); color: var(--text); }
    .ghost { background: transparent; border-color: currentColor; color: inherit; padding: 6px 12px; min-height: 36px; font-size: .9rem; }
    .actions { margin-top: 16px; }

    dialog {
      border: none; border-radius: 16px; padding: 0; color: var(--text);
      width: min(480px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(16, 24, 40, .25);
    }
    dialog::backdrop { background: rgba(16, 24, 40, .45); }
    dialog form { padding: 22px; }
    dialog h2 { font-size: 1.2rem; margin: 0; }
    .hint { color: var(--muted); font-size: .88rem; margin: 4px 0 0; }
    .field-label { display: block; font-size: .9rem; font-weight: 600; margin: 16px 0 6px; }
    input[type=text], input[type=email] {
      width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--field); border-radius: 10px; background: #fff; color: var(--text);
    }
    input[type=text]:focus, input[type=email]:focus { border-color: var(--accent); }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choices label { position: relative; }
    .choices input { position: absolute; opacity: 0; inset: 0; margin: 0; }
    .choices span { display: inline-block; padding: 9px 14px; border: 1px solid var(--field); border-radius: 99px; cursor: pointer; }
    .choices input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .choices input:focus-visible + span { outline: 3px solid var(--accent-soft); outline-offset: 1px; }
    .error { color: var(--danger); font-size: .9rem; margin: 14px 0 0; min-height: 1.3em; }
    .form-actions { display: flex; gap: 10px; margin-top: 10px; }
    .form-actions .primary { flex: 1; width: auto; }

    footer { margin-top: 32px; color: var(--muted); font-size: .9rem; }
    footer form { display: flex; gap: 8px; margin-top: 8px; }
    footer input { flex: 1; min-width: 0; }

    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      background: var(--text); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .92rem;
      max-width: calc(100vw - 32px); opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .loading { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="eventName">Breakout sessions</h1>
      <p class="subtitle" id="subtitle"></p>
      <p class="intro" id="intro"></p>
    </header>
    <div id="notice" hidden></div>
    <main class="list" id="sessions"><p class="loading">Loading sessions…</p></main>
    <footer>
      Signed up on another device? Enter your email to see your spot.
      <form id="lookup">
        <input type="email" id="lookupEmail" placeholder="you@company.com" autocomplete="email" inputmode="email" aria-label="Your email">
        <button type="submit" class="secondary">Find</button>
      </form>
    </footer>
  </div>

  <dialog id="dlg" aria-labelledby="dlgTitle">
    <form id="signupForm" novalidate>
      <h2 id="dlgTitle"></h2>
      <p class="hint" id="dlgRoom"></p>
      <p class="hint" id="dlgSwitch" hidden></p>
      <label class="field-label" for="name">Full name</label>
      <input id="name" type="text" autocomplete="name" maxlength="80">
      <label class="field-label" for="email">Work email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" maxlength="120">
      <p class="hint">Used for the calendar invite only. Not shown to others.</p>
      <span class="field-label" id="companyLabel">Company</span>
      <div id="companyField"></div>
      <p class="error" id="formError" role="alert"></p>
      <div class="form-actions">
        <button type="button" class="secondary" id="closeDlg">Cancel</button>
        <button type="submit" class="primary" id="submitBtn">Confirm</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // Apps Script web app URL, used when the page is hosted outside Google (GitHub Pages).
    const API_URL = 'https://script.google.com/macros/s/AKfycbyYdwVD73DG6M2tWj5i1ChKvfX21qh_lwBspHveLMGbLPlwud3tLcuioKr1dYgXUYY5/exec';
    const $ = id => document.getElementById(id);
    const STORE = 'breakoutSignup.me';
    let state = null;
    let me = loadMe();
    let activeSession = null;
    let cancelArmed = false;

    function loadMe() {
      try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; }
    }
    function saveMe(value) {
      me = value;
      try { localStorage.setItem(STORE, JSON.stringify(value)); } catch (e) {}
    }

    // Calls the Apps Script server: directly when served by Apps Script, over the JSON API when
    // hosted elsewhere, or in-memory sample data when opened as a local file (or with ?demo).
    function call(fn, ...args) {
      if (window.google && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
        });
      }
      if (location.protocol.startsWith('http') && !/[?&]demo\b/.test(location.search)) {
        const body = fn === 'signUp' ? { action: fn, form: args[0] } : { action: fn, email: args[0] };
        return fetch(API_URL, {
          method: 'POST',
          credentials: 'omit',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body),
        })
          .then(r => r.json())
          .then(res => { if (!res.ok) throw new Error(res.error); return res.data; });
      }
      return new Promise((resolve, reject) => {
        setTimeout(() => { try { resolve(mock[fn](...args)); } catch (e) { reject(e); } }, 250);
      });
    }
    const errText = e => String((e && e.message) || e).replace(/^(Error|Exception):\s*/, '');

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function render() {
      const s = state.settings;
      $('eventName').textContent = s.eventName || 'Breakout sessions';
      $('subtitle').textContent = s.subtitle;
      $('intro').textContent = s.intro;

      const mine = state.sessions.find(x => x.id === state.mySessionId);
      const notice = $('notice');
      notice.replaceChildren();
      notice.hidden = !mine && s.open;
      if (!s.open) {
        notice.className = 'notice closed';
        notice.append(el('span', null, 'Signups are closed.' + (mine ? ` You're in ${mine.title}, ${mine.room}.` : '')));
      } else if (mine) {
        notice.className = 'notice';
        notice.append(el('span', null, `You're in ${mine.title} · ${mine.room}`));
        const b = el('button', 'ghost', 'Cancel my spot');
        b.type = 'button';
        b.onclick = () => cancelMine(b);
        notice.append(b);
      }
      cancelArmed = false;

      $('sessions').replaceChildren(...state.sessions.map(sess => card(sess, s.open)));
    }

    function card(sess, open) {
      const n = sess.attendees.length;
      const cap = sess.capacity;
      const full = !!cap && n >= cap;
      const isMine = sess.id === state.mySessionId;
      const c = el('article', 'card' + (isMine ? ' mine' : '') + (full ? ' full' : ''));

      c.append(el('h2', null, sess.title));
      if (sess.room) c.append(el('div', 'room', sess.room));
      if (sess.description) c.append(el('p', 'desc', sess.description));

      const meter = el('div', 'meter');
      if (cap) {
        const bar = el('div', 'bar');
        const fill = el('span');
        fill.style.width = Math.min(100, (n / cap) * 100) + '%';
        bar.append(fill);
        meter.append(bar, el('span', null, full ? `Full · ${cap} of ${cap}` : `${cap - n} of ${cap} seats left`));
      } else {
        meter.append(el('span', null, n === 1 ? '1 person signed up' : `${n} people signed up`));
      }
      c.append(meter);

      const people = el('ul', 'people');
      if (!n) people.append(el('li', 'empty', 'No one yet.'));
      sess.attendees.forEach(a => {
        const li = el('li', null, a.name);
        if (a.company) li.append(' ', el('span', null, '· ' + a.company));
        people.append(li);
      });
      c.append(people);

      const btn = el('button', 'primary');
      btn.type = 'button';
      if (isMine) { btn.textContent = "✓ You're in this session"; btn.classList.add('in'); btn.disabled = true; }
      else if (!open) { btn.textContent = 'Signups closed'; btn.disabled = true; }
      else if (full) { btn.textContent = 'Session full'; btn.disabled = true; }
      else {
        btn.textContent = state.mySessionId ? 'Switch to this session' : 'Join this session';
        btn.onclick = () => openDialog(sess);
      }
      const actions = el('div', 'actions');
      actions.append(btn);
      c.append(actions);
      return c;
    }

    function openDialog(sess) {
      activeSession = sess;
      $('dlgTitle').textContent = sess.title;
      $('dlgRoom').textContent = sess.room;
      const current = state.sessions.find(x => x.id === state.mySessionId);
      $('dlgSwitch').hidden = !current;
      if (current) $('dlgSwitch').textContent = `This moves you out of ${current.title}.`;
      $('name').value = me.name || '';
      $('email').value = me.email || '';
      renderCompany();
      $('formError').textContent = '';
      $('dlg').showModal();
    }

    function renderCompany() {
      const field = $('companyField');
      field.replaceChildren();
      const companies = state.settings.companies;
      if (companies.length) {
        field.className = 'choices';
        field.setAttribute('role', 'radiogroup');
        field.setAttribute('aria-labelledby', 'companyLabel');
        companies.forEach(name => {
          const label = el('label');
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = 'company';
          input.value = name;
          input.checked = me.company === name;
          label.append(input, el('span', null, name));
          field.append(label);
        });
      } else {
        field.className = '';
        field.removeAttribute('role');
        const input = document.createElement('input');
        input.type = 'text';
        input.name = 'company';
        input.autocomplete = 'organization';
        input.maxLength = 80;
        input.value = me.company || '';
        input.setAttribute('aria-labelledby', 'companyLabel');
        field.append(input);
      }
    }

    function selectedCompany() {
      const input = document.querySelector('#companyField input[type=radio]:checked')
        || document.querySelector('#companyField input[type=text]');
      return input ? input.value.trim() : '';
    }

    $('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      const payload = {
        name: $('name').value.trim(),
        email: $('email').value.trim(),
        company: selectedCompany(),
        sessionId: activeSession.id,
      };
      if (!payload.name || !payload.email || !payload.company) {
        $('formError').textContent = 'Please fill in your name, email and company.';
        return;
      }
      const submit = $('submitBtn');
      submit.disabled = true;
      submit.textContent = 'Saving…';
      try {
        state = await call('signUp', payload);
        saveMe({ name: payload.name, email: payload.email, company: payload.company });
        $('dlg').close();
        render();
        toast(`You're in ${activeSession.title}.`);
      } catch (err) {
        $('formError').textContent = errText(err);
        refresh();
      } finally {
        submit.disabled = false;
        submit.textContent = 'Confirm';
      }
    });

    $('closeDlg').addEventListener('click', () => $('dlg').close());

    // Two taps to cancel, so a stray tap doesn't give up a seat.
    async function cancelMine(btn) {
      if (!cancelArmed) {
        cancelArmed = true;
        btn.textContent = 'Tap again to confirm';
        return;
      }
      btn.disabled = true;
      try {
        state = await call('cancel', me.email);
        render();
        toast('Your spot has been released.');
      } catch (err) {
        toast(errText(err));
        btn.disabled = false;
      }
    }

    $('lookup').addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('lookupEmail').value.trim();
      if (!email) return;
      saveMe(Object.assign({}, me, { email }));
      await refresh();
      toast(state.mySessionId ? 'Found your signup.' : 'No signup found for that email.');
    });

    let toastTimer;
    function toast(text) {
      const t = $('toast');
      t.textContent = text;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function refresh() {
      try {
        state = await call('getState', me.email || '');
        render();
      } catch (err) {
        if (!state) $('sessions').replaceChildren(el('p', 'loading', 'Could not load sessions. ' + errText(err)));
      }
    }

    refresh();
    // Keep seat counts current while the page is open (skipped while the form is open).
    setInterval(() => { if (!document.hidden && !$('dlg').open) refresh(); }, 30000);

    // Sample data for previewing Index.html directly in a browser (not used once deployed).
    const mock = (() => {
      const db = {
        settings: {
          eventName: 'Offsite breakout sessions', subtitle: 'Preview with sample data',
          intro: 'Pick one breakout session. You can switch until signups close.',
          companies: ['Mirantis', 'Company B'], open: true,
        },
        sessions: [
          { id: 'S1', title: 'Breakout 1 (title TBD)', room: 'Room A (TBD)', capacity: 6, description: '' },
          { id: 'S2', title: 'Breakout 2 (title TBD)', room: 'Room B (TBD)', capacity: 6, description: '' },
          { id: 'S3', title: 'Breakout 3 (title TBD)', room: 'Room C (TBD)', capacity: 6, description: '' },
          { id: 'S4', title: 'Breakout 4 (title TBD)', room: 'Room D (TBD)', capacity: null, description: '' },
        ],
        signups: [
          ['Alex Rivera', 'alex@a.test', 'Mirantis', 'S1'], ['Sam Chen', 'sam@b.test', 'Company B', 'S1'],
          ['Priya Nair', 'priya@b.test', 'Company B', 'S2'], ['Jordan Lee', 'jordan@a.test', 'Mirantis', 'S3'],
          ['Taylor Brooks', 't1@a.test', 'Mirantis', 'S3'], ['Morgan Diaz', 't2@b.test', 'Company B', 'S3'],
          ['Casey Park', 't3@a.test', 'Mirantis', 'S3'], ['Riley Shah', 't4@b.test', 'Company B', 'S3'],
          ['Jamie Fox', 't5@a.test', 'Mirantis', 'S3'],
        ].map(([name, email, company, sessionId]) => ({ name, email, company, sessionId })),
      };
      const getState = email => {
        const m = db.signups.find(r => r.email === String(email || '').toLowerCase());
        return {
          settings: db.settings,
          mySessionId: m ? m.sessionId : null,
          sessions: db.sessions.map(s => Object.assign({}, s, {
            attendees: db.signups.filter(r => r.sessionId === s.id).map(r => ({ name: r.name, company: r.company })),
          })),
        };
      };
      return {
        getState,
        signUp(f) {
          const email = f.email.toLowerCase();
          const s = db.sessions.find(x => x.id === f.sessionId);
          const taken = db.signups.filter(r => r.sessionId === s.id && r.email !== email).length;
          if (s.capacity && taken >= s.capacity) throw new Error('Sorry, that session just filled up.');
          db.signups = db.signups.filter(r => r.email !== email);
          db.signups.push({ name: f.name, email, company: f.company, sessionId: f.sessionId });
          return getState(email);
        },
        cancel(email) {
          db.signups = db.signups.filter(r => r.email !== email.toLowerCase());
          return getState(email);
        },
      };
    })();
  </script>
</body>
</html>
